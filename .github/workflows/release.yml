name: Release
run-name: Release ${{ inputs.tag }} from trusted main
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact appVersionName committed on main (e.g. 1.2.3-Alpha)
        type: string
        required: true
      prerelease:
        description: Mark as prerelease (otherwise becomes latest)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'ctqvva/JugglucoNG' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate version and unused release tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dist/release-preflight.py
  build:
    needs: prepare
    uses: ./.github/workflows/signed-build.yml
    with:
      target: all
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-all-${{ github.sha }}
          path: build/dist/all
      - name: Verify release assets and generate updater manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/dist/dist.py verify --target all
          scripts/make-update-manifest.sh build/dist/all > build/dist/all/update-manifest.json
          python3 scripts/dist/dist.py release-check --tag "$TAG"
      - name: Publish complete release
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repeat preflight after approval, in case another release appeared meanwhile.
          python3 scripts/dist/release-preflight.py
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          # Draft first: partial uploads must never be visible to the updater.
          # Atomically reserve the exact SHA; fail if anyone created the tag meanwhile.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" build/dist/all/*.apk build/dist/all/update-manifest.json
          gh release edit "$TAG" --draft=false "${flags[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
